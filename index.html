</style></head><body><main class="app"><header class="top"><div class="brand">POCKET <i>BLOCKS</i></div><div class="score">SCORE<b id="score">0</b></div></header><section class="game"><canvas class="board" id="board" width="300" height="600" aria-label="Tetris board"></canvas><aside class="side"><div class="panel">NEXT<canvas class="next" id="next" width="72" height="72"></canvas></div><div class="panel">LEVEL<div class="stat" id="level">1</div></div><div class="panel">LINES<div class="stat" id="lines">0</div></div></aside></section><div class="actions"><button class="btn primary" id="pause">PAUSE</button><button class="btn" id="restart">NEW GAME</button></div><div class="controls"><button class="btn" data-k="left">←</button><button class="btn" data-k="rotate">↻</button><button class="btn" data-k="right">→</button><button class="btn wide" data-k="down">▼ DROP</button></div><p class="hint">Tap the board to rotate · swipe to move or drop</p></main><div class="overlay" id="overlay"><div class="modal"><h1 id="title">Pocket Blocks</h1><p id="message">Clear complete rows. Use the buttons or swipe the board.</p><button class="btn primary" id="start">START PLAYING</button></div></div>

function make(){let i=Math.floor(Math.random()*7);return{m:shapes[i].map(r=>r.slice()),c:colors[i],x:3,y:-1}}

function collide(p,dx=0,dy=0,m=p.m){return m.some((r,y)=>r.some((v,x)=>v&&((p.y+y+dy>=H)||(p.x+x+dx<0)||(p.x+x+dx>=W)||(p.y+y+dy>=0&&grid[p.y+y+dy][p.x+x+dx]))))}

function block(c,x,y,s=C,g=ctx,offset=0){g.fillStyle=c;g.fillRect(x*s+1+offset,y*s+1,s-2,s-2);g.fillStyle='#ffffff38';g.fillRect(x*s+4+offset,y*s+4,s-8,4)}function draw(){ctx.fillStyle='#080c18';ctx.fillRect(0,0,300,600);ctx.strokeStyle='#ffffff09';for(let x=0;x<=W;x++){ctx.beginPath();ctx.moveTo(x*C,0);ctx.lineTo(x*C,600);ctx.stroke()}for(let y=0;y<=H;y++){ctx.beginPath();ctx.moveTo(0,y*C);ctx.lineTo(300,y*C);ctx.stroke()}grid.forEach((r,y)=>r.forEach((c,x)=>c&&block(c,x,y)));piece.m.forEach((r,y)=>r.forEach((v,x)=>v&&piece.y+y>=0&&block(piece.c,piece.x+x,piece.y+y,C,ctx,dragX)));nctx.clearRect(0,0,72,72);let ox=(4-next.m[0].length)/2,oy=(4-next.m.length)/2;next.m.forEach((r,y)=>r.forEach((v,x)=>v&&block(next.c,x+ox,y+oy,18,nctx)))}

const overlay=document.querySelector('#overlay'),title=document.querySelector('#title'),message=document.querySelector('#message'),startBtn=document.querySelector('#start'),pause=document.querySelector('#pause'),restart=document.querySelector('#restart');startBtn.onclick=start;restart.onclick=start;pause.onclick=()=>{if(!run)return;paused=!paused;pause.textContent=paused?'RESUME':'PAUSE'};document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>({left:()=>move(-1,0),right:()=>move(1,0),rotate,down:hard}[b.dataset.k])());document.addEventListener('keydown',e=>{let f={ArrowLeft:()=>move(-1,0),ArrowRight:()=>move(1,0),ArrowUp:rotate,ArrowDown:hard,' ':hard}[e.key];if(f){e.preventDefault();f()}});document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});function available(dir){let n=0;while(!collide(piece,dir*(n+1),0))n++;return n}function follow(e){if(!touch)return;let dx=e.clientX-touch.x,dy=e.clientY-touch.y;if(Math.abs(dx)>Math.abs(dy)){let limit=(dx<0?available(-1):available(1))*C;dragX=Math.sign(dx)*Math.min(Math.abs(dx),limit);draw()}}function release(e){if(!touch)return;let dx=dragX,dy=e.clientY-touch.y;if(Math.abs(dx)<15&&Math.abs(dy)<15)rotate();else if(Math.abs(dx)>Math.abs(dy)){let steps=Math.round(Math.abs(dx)/C);for(let i=0;i<steps;i++)move(dx>0?1:-1,0)}else if(dy>25)hard();dragX=0;touch=null;draw()}board.addEventListener('pointerdown',e=>{e.preventDefault();touch={x:e.clientX,y:e.clientY};dragX=0;board.setPointerCapture(e.pointerId)},{passive:false});board.addEventListener('pointermove',e=>{e.preventDefault();follow(e)},{passive:false});board.addEventListener('pointerup',e=>{e.preventDefault();release(e)},{passive:false});board.addEventListener('pointercancel',()=>{touch=null;dragX=0;draw()},{passive:false});reset();
